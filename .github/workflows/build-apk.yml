name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python + Pillow
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Vérifier la bibliothèque d'illustrations 3D
        run: |
          set -euo pipefail
          test -s app/src/main/assets/images/3d/gabriel-explorer-3d.png
          test -s app/src/main/assets/images/3d/nova-robot-3d.png
          test -s app/src/main/assets/images/3d/lumi-fairy-3d.png
          test -s app/src/main/assets/images/3d/magic-world-3d.png
          test -s app/src/main/assets/visual-library.json

      - name: Générer une icône d'application premium
        run: |
          python -m pip install --quiet Pillow
          mkdir -p app/src/main/res/drawable
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFilter
          import math
          S=512
          im=Image.new("RGBA",(S,S),(8,13,35,255))
          px=im.load()
          for y in range(S):
            for x in range(S):
              dx=x-256; dy=y-256
              glow=max(0,1-math.sqrt(dx*dx+dy*dy)/370)
              px[x,y]=(int(8+18*glow),int(13+48*glow),int(35+92*glow),255)
          d=ImageDraw.Draw(im)
          d.ellipse((72,72,440,440),outline=(103,224,255,210),width=7)
          d.ellipse((91,91,421,421),outline=(153,115,255,130),width=3)
          # Livre ouvert lumineux
          d.rounded_rectangle((116,175,252,340),radius=24,fill=(239,247,255,255))
          d.rounded_rectangle((260,175,396,340),radius=24,fill=(205,226,255,255))
          d.line((256,184,256,337),fill=(77,111,183,255),width=8)
          d.line((143,222,224,222),fill=(96,142,211,255),width=8)
          d.line((143,252,224,252),fill=(96,142,211,255),width=8)
          d.line((287,222,368,222),fill=(96,142,211,255),width=8)
          d.line((287,252,368,252),fill=(96,142,211,255),width=8)
          # Étoile centrale
          pts=[]
          for i in range(10):
            a=-math.pi/2+i*math.pi/5
            r=56 if i%2==0 else 25
            pts.append((256+math.cos(a)*r,130+math.sin(a)*r))
          d.polygon(pts,fill=(255,207,91,255))
          im=im.filter(ImageFilter.SMOOTH)
          im.save("app/src/main/res/drawable/icon.png")
          PY

      - name: Télécharger Three.js localement (licence MIT)
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/vendor
          curl -fL --retry 3 https://unpkg.com/three@0.160.0/build/three.module.js -o app/src/main/assets/vendor/three.module.js
          test -s app/src/main/assets/vendor/three.min.js
          echo "Three.js module embarqué : $(wc -c < app/src/main/assets/vendor/three.min.js) octets"

      - name: Configurer Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Compiler l'APK (debug)
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RevisePlus-V14-Univers-3D-APK
          path: app/build/outputs/apk/debug/app-debug.apk
