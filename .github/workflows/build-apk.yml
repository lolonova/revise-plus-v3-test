name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python + Pillow (icone)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generer l'icone
        run: |
          python -m pip install --quiet Pillow
          mkdir -p app/src/main/res/drawable
          python - <<'EOF'
          from PIL import Image, ImageDraw
          img = Image.new("RGBA", (512, 512), (11, 16, 38, 255))
          d = ImageDraw.Draw(img)
          d.ellipse([96, 96, 416, 416], fill=(90, 160, 255, 255))
          d.rectangle([236, 140, 276, 300], fill=(255, 255, 255, 255))
          d.polygon([(256, 360), (200, 280), (312, 280)], fill=(255, 205, 60, 255))
          img.save("app/src/main/res/drawable/icon.png")
          EOF

      - name: Configurer Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Compiler l'APK (debug)
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RevisePlus-V6-APK
          path: app/build/outputs/apk/debug/app-debug.apk
