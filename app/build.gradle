plugins {
    id 'com.android.application'
}

android {
    namespace 'fr.reviseplus.app'
    compileSdk 35

    defaultConfig {
        applicationId "fr.reviseplus.app"
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName "4.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
}
